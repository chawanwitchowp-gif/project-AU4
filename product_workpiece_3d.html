<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>โมเดล 3 มิติ - ชิ้นงาน (Product) 2 แท่งเกลียวพร้อมโบ้ว</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050505; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #ui {
    position:absolute; top:16px; left:16px; z-index:10;
    background:rgba(20,20,20,0.85); backdrop-filter: blur(6px);
    border:1px solid #333; border-radius:10px; padding:14px 16px;
    color:#eee; font-size:13px; max-width:270px;
  }
  #ui h1 { font-size:15px; margin:0 0 6px; font-weight:600; }
  #ui p { margin:0; color:#aaa; line-height:1.5; }
  #hint { position:absolute; bottom:14px; left:16px; color:#888; font-size:11.5px; z-index:10; }
</style>
</head>
<body>
<div id="ui">
  <h1>ชิ้นงาน (Product)</h1>
  <p>แผ่นฐาน + แท่งเกลียว 2 แท่ง (กึ่งกลางซ้าย/ขวา) แต่ละแท่งมีโบ้วสวมอยู่ด้านบน</p>
</div>
<div id="hint">ลากเมาส์ = หมุนกล้อง | สกรอลล์ = ซูมเข้า-ออก</div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

var camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 200);

var renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

// ---- manual orbit camera (self-contained, no external addon) ----
var target = new THREE.Vector3(0, 0.6, 0);
var radius = 9, theta = -0.55, phi = 1.0;
var isDragging = false, lastX = 0, lastY = 0;
function updateCamera(){
  var x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  var y = target.y + radius * Math.cos(phi);
  var z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.position.set(x, y, z);
  camera.lookAt(target);
}
updateCamera();
var dom = renderer.domElement;
dom.style.touchAction = 'none';
dom.addEventListener('pointerdown', function(e){ isDragging = true; lastX = e.clientX; lastY = e.clientY; dom.setPointerCapture(e.pointerId); });
dom.addEventListener('pointerup', function(){ isDragging = false; });
dom.addEventListener('pointerleave', function(){ isDragging = false; });
dom.addEventListener('pointermove', function(e){
  if(!isDragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  theta -= dx * 0.006;
  phi -= dy * 0.006;
  phi = Math.max(0.25, Math.min(Math.PI - 0.25, phi));
  updateCamera();
});
dom.addEventListener('wheel', function(e){
  e.preventDefault();
  radius += e.deltaY * 0.01;
  radius = Math.max(3, Math.min(22, radius));
  updateCamera();
}, {passive:false});

// ---- lighting for a bright polished-metal look ----
scene.add(new THREE.HemisphereLight(0xffffff, 0x30302a, 0.55));
var key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(6, 9, 5);
scene.add(key);
var fill = new THREE.DirectionalLight(0xbcd4ff, 0.5);
fill.position.set(-7, 4, -3);
scene.add(fill);
var rim = new THREE.DirectionalLight(0xfff2d0, 0.6);
rim.position.set(-2, 3, -7);
scene.add(rim);

function mat(hex, opts){ opts = opts||{}; return new THREE.MeshStandardMaterial(Object.assign({color:hex, roughness:0.25, metalness:0.85}, opts)); }

var plateMat = mat(0xc9cdd2, {roughness:0.28, metalness:0.85});
var shaftMat = mat(0x9a9d9f, {roughness:0.3, metalness:0.8});
var goldMat = mat(0xcf9a3f, {roughness:0.32, metalness:0.9});

// ---- base plate ----
var plateW = 5.6, plateD = 3.4, plateH = 0.55;
var plate = new THREE.Mesh(new THREE.BoxGeometry(plateW, plateH, plateD), plateMat);
plate.position.set(0, plateH/2, 0);
scene.add(plate);

// subtle bevel edge look: thin darker trim strip along bottom
var trim = new THREE.Mesh(new THREE.BoxGeometry(plateW*1.002, 0.08, plateD*1.002), mat(0x6a6d70,{roughness:0.4}));
trim.position.set(0, 0.04, 0);
scene.add(trim);

// ---- helper: build a threaded stud with a bolt/nut cap on top ----
function buildStud(x){
  var group = new THREE.Group();

  var shaftR = 0.34, shaftH = 1.55;
  var shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, shaftH, 28), shaftMat);
  shaft.position.y = plateH + shaftH/2 - 0.05;
  group.add(shaft);

  // thread ridges: stacked thin toruses spiraling visually along the shaft
  var threadCount = 16;
  var threadStart = plateH + 0.18;
  var threadEnd = plateH + shaftH - 0.22;
  for(var i=0; i<threadCount; i++){
    var yPos = threadStart + (i/(threadCount-1)) * (threadEnd - threadStart);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(shaftR + 0.03, 0.045, 8, 24), shaftMat);
    ring.rotation.x = Math.PI/2;
    ring.rotation.z = (i * 0.35); // slight stagger to read as a spiral
    ring.position.y = yPos;
    group.add(ring);
  }

  // bolt / nut cap on top (hex head)
  var hex = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.52, 6), goldMat);
  hex.position.y = plateH + shaftH + 0.21;
  group.add(hex);

  // small collar where hex meets shaft
  var collar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.36, 0.14, 20), goldMat);
  collar.position.y = plateH + shaftH + 0.02;
  group.add(collar);

  group.position.x = x;
  return group;
}

var studSpacing = 1.35;
scene.add(buildStud(-studSpacing));
scene.add(buildStud(studSpacing));

// ---- soft ground shadow catcher (visual only, subtle) ----
var shadowMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.35});
var shadowGeo = new THREE.CircleGeometry(0.55, 24);
[-studSpacing, studSpacing].forEach(function(x){
  var m = new THREE.Mesh(shadowGeo, shadowMat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x, plateH + 0.001, 0);
  scene.add(m);
});

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
