<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>โมเดล 3 มิติ - สถานีขันโบ้ว + กล้องตรวจสอบ + คัดของเสีย</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050505; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #ui {
    position:absolute; top:16px; left:16px; z-index:10;
    background:rgba(20,20,20,0.85); backdrop-filter: blur(6px);
    border:1px solid #333; border-radius:10px; padding:14px 16px;
    color:#eee; font-size:13px; max-width:305px;
  }
  #ui h1 { font-size:15px; margin:0 0 8px; font-weight:600; }
  #ui button {
    background:#2a2a2a; color:#eee; border:1px solid #444; border-radius:6px;
    padding:7px 12px; font-size:13px; cursor:pointer; margin-right:6px;
  }
  #ui button:hover { background:#383838; }
  #ui button.active-ok { background:#1d7a4d; border-color:#2fae82; }
  #ui button.active-ng { background:#8a2f22; border-color:#c85a3f; }
  #ui .row { display:flex; align-items:center; gap:8px; margin-top:10px; }
  #ui input[type=range] { flex:1; }
  #ui .sub { color:#888; font-size:11.5px; margin-top:6px; }
  #state { margin-top:10px; color:#9fd; font-size:12.5px; min-height:32px; line-height:1.4; }
  .legend { margin-top:12px; display:flex; flex-direction:column; gap:5px; }
  .legend span.dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  #hint { position:absolute; bottom:14px; left:16px; color:#888; font-size:11.5px; z-index:10; }
</style>
</head>
<body>
<div id="ui">
  <h1>สถานีขันโบ้ว + กล้องตรวจสอบ</h1>
  <div>
    <button id="playBtn">เริ่มรอบการทำงาน</button>
    <button id="resetBtn">รีเซ็ต</button>
  </div>
  <div class="row">
    <label style="white-space:nowrap;">ความเร็ว</label>
    <input type="range" id="speed" min="0.3" max="3" step="0.1" value="1">
  </div>
  <div class="row">
    <label style="white-space:nowrap;">ผลตรวจกล้อง (จำลอง)</label>
  </div>
  <div class="row" style="margin-top:4px;">
    <button id="okBtn" class="active-ok">OK ผ่าน</button>
    <button id="ngBtn">NG ไม่ผ่าน</button>
  </div>
  <div class="sub">เลือกผลลัพธ์ก่อนกดเริ่ม เพื่อดูว่ากล้องจะปล่อยผ่านหรือสั่งนิวเมติกดันชิ้นงานออก</div>
  <div id="state">พร้อมทำงาน</div>
  <div class="legend">
    <div><span class="dot" style="background:#4a90d9"></span>เซอร์โว/หัวขัน (ตัวเดียว)</div>
    <div><span class="dot" style="background:#2fae82"></span>เซนเซอร์ตรวจตำแหน่ง</div>
    <div><span class="dot" style="background:#c85a3f"></span>นิวเมติก 1 / นิวเมติก 2</div>
    <div><span class="dot" style="background:#e0c23c"></span>กล้องตรวจสอบ (Vision)</div>
    <div><span class="dot" style="background:#d84f4f"></span>นิวเมติกคัดของเสีย</div>
  </div>
</div>
<div id="hint">ลากเมาส์ = หมุนกล้อง | สกรอลล์ = ซูมเข้า-ออก</div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

var camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 300);

var renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

// ---- manual orbit camera (self-contained, no external addon) ----
var target = new THREE.Vector3(1.2, 1.3, 0);
var radius = 19, theta = 0.9, phi = 1.05;
var isDragging = false, lastX = 0, lastY = 0;
function updateCamera(){
  var x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  var y = target.y + radius * Math.cos(phi);
  var z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.position.set(x, y, z);
  camera.lookAt(target);
}
updateCamera();
var dom = renderer.domElement;
dom.style.touchAction = 'none';
dom.addEventListener('pointerdown', function(e){ isDragging = true; lastX = e.clientX; lastY = e.clientY; dom.setPointerCapture(e.pointerId); });
dom.addEventListener('pointerup', function(){ isDragging = false; });
dom.addEventListener('pointerleave', function(){ isDragging = false; });
dom.addEventListener('pointermove', function(e){
  if(!isDragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  theta -= dx * 0.006;
  phi -= dy * 0.006;
  phi = Math.max(0.25, Math.min(Math.PI - 0.25, phi));
  updateCamera();
});
dom.addEventListener('wheel', function(e){
  e.preventDefault();
  radius += e.deltaY * 0.015;
  radius = Math.max(5, Math.min(40, radius));
  updateCamera();
}, {passive:false});

// ---- lighting ----
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a26, 0.55));
var key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(8, 12, 6);
scene.add(key);
var fill = new THREE.DirectionalLight(0xbcd4ff, 0.45);
fill.position.set(-9, 5, -4);
scene.add(fill);
var rim = new THREE.DirectionalLight(0xfff2d0, 0.5);
rim.position.set(-2, 4, -9);
scene.add(rim);

function mat(hex, opts){ opts = opts||{}; return new THREE.MeshStandardMaterial(Object.assign({color:hex, roughness:0.45, metalness:0.35}, opts)); }

var conveyorMat = mat(0x9aa0a4, {roughness:0.32, metalness:0.75});   // ลูกกลิ้งเหล็ก/อลูมิเนียม ผิวมัน
var beltMat = mat(0x1e6b3e, {roughness:0.78, metalness:0.04});       // สายพานยางสีเขียว
var beltRibMat = mat(0x123f26, {roughness:0.85, metalness:0.03});    // ร่องยางสีเข้มบนสายพาน
var frameMat = mat(0xcdd0d2, {roughness:0.3, metalness:0.5});        // โครงอลูมิเนียมโปรไฟล์ (T-slot) แบบในรูปตัวอย่าง
var jointMat = mat(0x272727, {roughness:0.55, metalness:0.25});      // มุมยึด/บล็อคข้อต่อสีเข้ม
var clampMat = mat(0xcf3a2b, {roughness:0.5, metalness:0.08});       // แคลมป์/บราเก็ตยึดอุปกรณ์สีแดง (แบบพิมพ์ 3 มิติในรูปตัวอย่าง)
var pneuMat = mat(0x4a90d9, {metalness:0.55, roughness:0.28});
var stopperMat1 = mat(0xc85a3f, {metalness:0.5, roughness:0.32});
var stopperMat2 = mat(0x9a4fd8, {metalness:0.5, roughness:0.32});
var camMat = mat(0x2fae82, {metalness:0.4, roughness:0.35});
var visionMat = mat(0xe0c23c, {metalness:0.4, roughness:0.35});
var rejectMat = mat(0xd84f4f, {metalness:0.5, roughness:0.3});
var binMat = mat(0x3a3632, {roughness:0.8, metalness:0.1});
var plateMat = mat(0xc9cdd2, {roughness:0.28, metalness:0.85});
var shaftMat = mat(0x9a9d9f, {roughness:0.3, metalness:0.8});
var goldMat = mat(0xcf9a3f, {roughness:0.32, metalness:0.9});
var darkMetal = mat(0x2c2c2a, {roughness:0.4, metalness:0.6});

// ================= CONVEYOR =================
var BELT_TOP_Y = 0.8;
var beltLen = 20, beltW = 2.6, beltH = 0.4;
var GROUND_Y = BELT_TOP_Y - beltH/2 - 1.7; // เลเวลพื้นจริง ตรงกับฐานขาตั้งสายพาน ใช้อ้างอิงจุดยึดของอุปกรณ์ทุกตัว
var conveyorGroup = new THREE.Group();
var belt = new THREE.Mesh(new THREE.BoxGeometry(beltLen, beltH, beltW), beltMat);
belt.position.set(2.4, BELT_TOP_Y - beltH/2, 0);
conveyorGroup.add(belt);

// ริ้วยางบนสายพาน (จำลองผิวสายพานยางจริง)
var ribGeo = new THREE.BoxGeometry(0.05, 0.012, beltW - 0.06);
var ribSpacing = 0.55;
for(var rx = 2.4 - beltLen/2 + 0.5; rx < 2.4 + beltLen/2 - 0.5; rx += ribSpacing){
  var rib = new THREE.Mesh(ribGeo, beltRibMat);
  rib.position.set(rx, BELT_TOP_Y + 0.006, 0);
  conveyorGroup.add(rib);
}

// รางเหล็กกันของหล่น (skirt rail) ขอบสายพานทั้ง 2 ฝั่ง
var railGeo = new THREE.BoxGeometry(beltLen - 0.6, 0.28, 0.05);
var railL = new THREE.Mesh(railGeo, frameMat);
railL.position.set(2.4, BELT_TOP_Y + 0.18, beltW/2 + 0.04);
conveyorGroup.add(railL);
var railR = new THREE.Mesh(railGeo, frameMat);
railR.position.set(2.4, BELT_TOP_Y + 0.18, -beltW/2 - 0.04);
conveyorGroup.add(railR);
// เสาค้ำรางเหล็กเป็นระยะ
for(var rrx = 2.4 - beltLen/2 + 0.8; rrx < 2.4 + beltLen/2 - 0.8; rrx += 1.4){
  [beltW/2 + 0.04, -beltW/2 - 0.04].forEach(function(rz){
    var brk = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.28,0.08), frameMat);
    brk.position.set(rrx, BELT_TOP_Y + 0.05, rz);
    conveyorGroup.add(brk);
  });
}

function roller(x){
  // roller/tensioner drum axis must run across the belt WIDTH (Z), not along
  // the travel direction — rotating about X (not Z) achieves that.
  var r = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,beltW+0.3,24), conveyorMat);
  r.rotation.x = Math.PI/2;
  r.position.set(x, BELT_TOP_Y - beltH/2, 0);
  conveyorGroup.add(r);
}
roller(2.4 - beltLen/2 + 0.35);
roller(2.4 + beltLen/2 - 0.35);

var legXs = [-6.0,-2.4, 1.2, 4.8, 8.4, 11.6];
var railZ = beltW/2 - 0.15;

function leg(x,z){
  var l = new THREE.Mesh(new THREE.BoxGeometry(0.22,1.6,0.22), frameMat);
  l.position.set(x, BELT_TOP_Y - beltH/2 - 0.9, z);
  conveyorGroup.add(l);
  // บล็อคข้อต่อสีเข้มบน-ล่าง ตรงจุดที่ขายึดกับรางบน/ราง ล่าง (เหมือนมุมยึดโปรไฟล์อลูมิเนียมจริง)
  var jointTop = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.1,0.28), jointMat);
  jointTop.position.set(x, BELT_TOP_Y - beltH/2 - 0.05, z);
  conveyorGroup.add(jointTop);
  var jointBottom = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.1,0.28), jointMat);
  jointBottom.position.set(x, GROUND_Y + 0.15, z);
  conveyorGroup.add(jointBottom);
}
legXs.forEach(function(x){
  leg(x, railZ); leg(x, -railZ);
  // คานขวางเชื่อมขาหน้า-หลังเพื่อความสมจริงของโครงเหล็ก
  var crossTie = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12, railZ*2), frameMat);
  crossTie.position.set(x, BELT_TOP_Y - beltH/2 - 1.15, 0);
  conveyorGroup.add(crossTie);
});

// รางอลูมิเนียมยาวต่อเนื่องด้านบน (รองรับสายพาน) และด้านล่าง (ฐานโครง) ตลอดแนว — ให้ดูเป็นโต๊ะโปรไฟล์จริงเหมือนภาพตัวอย่าง
var railSpanMin = legXs[0], railSpanMax = legXs[legXs.length-1];
var railLen = railSpanMax - railSpanMin + 0.6;
var railMidX = (railSpanMin + railSpanMax) / 2;
[railZ, -railZ].forEach(function(z){
  var topRail = new THREE.Mesh(new THREE.BoxGeometry(railLen, 0.08, 0.22), frameMat);
  topRail.position.set(railMidX, BELT_TOP_Y - beltH/2 - 0.1, z);
  conveyorGroup.add(topRail);
  var bottomRail = new THREE.Mesh(new THREE.BoxGeometry(railLen, 0.1, 0.22), frameMat);
  bottomRail.position.set(railMidX, GROUND_Y + 0.1, z);
  conveyorGroup.add(bottomRail);
});
// ขาปรับระดับเล็กๆ ที่ปลายรางล่างทั้ง 4 จุด
[[railSpanMin-0.2, railZ],[railSpanMin-0.2,-railZ],[railSpanMax+0.2, railZ],[railSpanMax+0.2,-railZ]].forEach(function(p){
  var foot = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.12,12), jointMat);
  foot.position.set(p[0], GROUND_Y + 0.02, p[1]);
  conveyorGroup.add(foot);
});
scene.add(conveyorGroup);

// ================= PRODUCT (plate + 2 threaded studs IN LINE with belt travel) =================
var studOffset = 0.62;
var plateLen = 2.0, plateW = 1.05, plateH = 0.32;
var shaftR = 0.185, shaftH = 0.85;
var nutTopY = plateH + shaftH + 0.1;
var nutSeatedY = plateH + 0.2;

function buildStud(){
  var group = new THREE.Group();
  var shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, shaftH, 24), shaftMat);
  shaft.position.y = plateH + shaftH/2;
  group.add(shaft);

  var threadCount = 12;
  var threadStart = plateH + 0.1;
  var threadEnd = plateH + shaftH - 0.12;
  for(var i=0;i<threadCount;i++){
    var yPos = threadStart + (i/(threadCount-1)) * (threadEnd - threadStart);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(shaftR + 0.02, 0.026, 8, 20), shaftMat);
    ring.rotation.x = Math.PI/2;
    ring.rotation.z = i * 0.35;
    ring.position.y = yPos;
    group.add(ring);
  }

  var nutGroup = new THREE.Group();
  var hex = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.28, 6), goldMat);
  nutGroup.add(hex);
  var collar = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.19, 0.08, 20), goldMat);
  collar.position.y = -0.18;
  nutGroup.add(collar);
  nutGroup.position.y = nutTopY;
  group.add(nutGroup);
  group.userData.nutGroup = nutGroup;
  return group;
}

var productGroup = new THREE.Group();
var plate = new THREE.Mesh(new THREE.BoxGeometry(plateLen, plateH, plateW), plateMat);
plate.position.y = plateH/2;
productGroup.add(plate);
var trim = new THREE.Mesh(new THREE.BoxGeometry(plateLen*1.01, 0.06, plateW*1.01), darkMetal);
trim.position.y = 0.03;
productGroup.add(trim);

var studA = buildStud(); studA.position.x = studOffset;
var studB = buildStud(); studB.position.x = -studOffset;
productGroup.add(studA);
productGroup.add(studB);

// ================= KEY POSITIONS ALONG THE LINE =================
var STATION_X = 0.4;                      // ตำแหน่งเซอร์โวขันโบ้ว (คงที่)
var STOP1_X = STATION_X - studOffset;     // ชิ้นงานหยุดครั้งที่ 1 (นอตหน้า)
var STOP2_X = STATION_X + studOffset;     // ชิ้นงานหยุดครั้งที่ 2 (นอตหลัง)
var CAM_X   = STOP2_X + 2.2;              // ตำแหน่งกล้องตรวจสอบ
var PUSH_X  = CAM_X + 1.3;                // ตำแหน่งนิวเมติกคัดของเสีย
var ENTRY_X = -6.8;
var EXIT_X  = PUSH_X + 3.2;               // ทางออกฝั่งของดี (ไหลตรงต่อ)
var offBeltZ = beltW/2 + 1.9;             // ตำแหน่ง Z เมื่อถูกดันตกออกจากสายพาน (ของเสีย)

productGroup.position.set(ENTRY_X, BELT_TOP_Y, 0);
scene.add(productGroup);

// ================= SENSOR #1 (through-beam, ก่อนสถานีขัน) =================
var SENSOR_X = STATION_X - 2.2;
var sensorPostH = (BELT_TOP_Y + 0.55) - GROUND_Y; // ยืดเสาให้ถึงพื้นจริง

function buildSensorPost(){
  var g = new THREE.Group();
  var post = new THREE.Mesh(new THREE.BoxGeometry(0.12, sensorPostH, 0.12), frameMat);
  post.position.y = sensorPostH/2;
  g.add(post);
  var foot = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.04,0.32), frameMat);
  foot.position.y = -0.02;
  g.add(foot);
  return g;
}

var sensorGroup = buildSensorPost();
var sensorClamp = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.14,0.2), clampMat);
sensorClamp.position.set(0, sensorPostH + 0.05, 0.02);
sensorGroup.add(sensorClamp);
var sensorBody = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.4,0.3), camMat);
sensorBody.position.set(0, sensorPostH + 0.05, 0.05);
sensorGroup.add(sensorBody);
var sensorLens = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.09,0.16,16), darkMetal);
sensorLens.rotation.x = Math.PI/2;
sensorLens.position.set(0, sensorPostH + 0.05, 0.24);
sensorGroup.add(sensorLens);
var sensorLED = new THREE.Mesh(new THREE.SphereGeometry(0.05,12,12), new THREE.MeshBasicMaterial({color:0x333333}));
sensorLED.position.set(0, sensorPostH + 0.28, 0.05);
sensorGroup.add(sensorLED);
sensorGroup.position.set(SENSOR_X, GROUND_Y, -beltW/2 - 0.22);
scene.add(sensorGroup);

var receiverGroup = buildSensorPost();
var receiverClamp = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.12,0.18), clampMat);
receiverClamp.position.set(0, sensorPostH + 0.05, -0.02);
receiverGroup.add(receiverClamp);
var receiverBody = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.34,0.24), darkMetal);
receiverBody.position.set(0, sensorPostH + 0.05, -0.05);
receiverGroup.add(receiverBody);
receiverGroup.position.set(SENSOR_X, GROUND_Y, beltW/2 + 0.2);
scene.add(receiverGroup);

var beamGeo = new THREE.CylinderGeometry(0.012,0.012,1,8);
var beamMat = new THREE.MeshBasicMaterial({color:0x2fae82, transparent:true, opacity:0.5});
var beam = new THREE.Mesh(beamGeo, beamMat);
scene.add(beam);
var beamFrom = new THREE.Vector3();
var beamTo = new THREE.Vector3();
function updateBeam(){
  sensorLens.getWorldPosition(beamFrom);
  receiverBody.getWorldPosition(beamTo);
  var mid = beamFrom.clone().add(beamTo).multiplyScalar(0.5);
  var dist = beamFrom.distanceTo(beamTo);
  beam.position.copy(mid);
  beam.scale.y = dist;
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), beamTo.clone().sub(beamFrom).normalize());
}
updateBeam();

// ================= SIGNAL TOWER LIGHT (andon) — จุดสังเกตสถานะเครื่อง เหมือนในภาพตัวอย่าง =================
var towerBaseX = ENTRY_X - 0.6;
var towerPostH = BELT_TOP_Y + 1.9 - GROUND_Y;
var towerPost = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.08,towerPostH,14), darkMetal);
towerPost.position.set(towerBaseX, GROUND_Y + towerPostH/2, -beltW/2 - 0.3);
scene.add(towerPost);
var towerFoot = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.06,0.3), jointMat);
towerFoot.position.set(towerBaseX, GROUND_Y - 0.01, -beltW/2 - 0.3);
scene.add(towerFoot);
var towerColors = [0xd8443a, 0xe0c23c, 0x2fae82];
var towerLights = [];
for(var ti=0; ti<towerColors.length; ti++){
  var seg = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.22,16), new THREE.MeshStandardMaterial({color:towerColors[ti], emissive:towerColors[ti], emissiveIntensity:0.12, roughness:0.35, metalness:0.1, transparent:true, opacity:0.9}));
  seg.position.set(towerBaseX, GROUND_Y + towerPostH + 0.13 + ti*0.24, -beltW/2 - 0.3);
  scene.add(seg);
  towerLights.push(seg);
}
var towerRed = towerLights[0], towerYellow = towerLights[1], towerGreen = towerLights[2];
var towerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.1,0.1,16), darkMetal);
towerCap.position.set(towerBaseX, GROUND_Y + towerPostH + 0.13 + towerColors.length*0.24 + 0.03, -beltW/2 - 0.3);
scene.add(towerCap);

// ================= SIDE-MOUNTED TIGHTENER (ยื่นออกมาจากด้านข้าง) =================
var armY = BELT_TOP_Y + 2.15;              // ความสูงจุดยึดแขน (อ้างอิงจากระดับสายพาน)
var sideMountZ = -(beltW/2 + 0.5);
var sidePostLen = armY - GROUND_Y;         // ยืดเสาให้ถึงพื้นจริง โดยความสูงจุดยึดเท่าเดิม

var sidePost = new THREE.Mesh(new THREE.BoxGeometry(0.16, sidePostLen, 0.16), frameMat);
sidePost.position.set(STATION_X, GROUND_Y + sidePostLen/2, sideMountZ);
scene.add(sidePost);

var sidePostBase = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.05,0.42), frameMat);
sidePostBase.position.set(STATION_X, GROUND_Y - 0.02, sideMountZ);
scene.add(sidePostBase);

var armOut = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, Math.abs(sideMountZ)), frameMat);
armOut.position.set(STATION_X, armY, sideMountZ/2);
scene.add(armOut);

var armBrace = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, Math.abs(sideMountZ)*0.75), clampMat);
armBrace.rotation.x = -0.6;
armBrace.position.set(STATION_X, armY - 0.55, sideMountZ*0.42);
scene.add(armBrace);

var cylLen = 0.65;
var tightener = new THREE.Group();
var cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,cylLen,20), pneuMat);
tightener.add(cyl);
tightener.position.set(STATION_X, armY - cylLen/2 - 0.06, 0);
scene.add(tightener);

var rodGroup = new THREE.Group();
var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.049,0.049,0.585,16), frameMat);
rod.position.y = -0.52;
rodGroup.add(rod);
var socket = new THREE.Mesh(new THREE.CylinderGeometry(0.325,0.325,0.26,6), darkMetal);
socket.position.y = -0.91;
rodGroup.add(socket);
var socketRing = new THREE.Mesh(new THREE.TorusGeometry(0.325,0.026,8,6), pneuMat);
socketRing.rotation.x = Math.PI/2;
socketRing.position.y = -0.78;
rodGroup.add(socketRing);
tightener.add(rodGroup);

// ================= PNEUMATIC GATE STOPPERS x2 (perpendicular to belt) =================
var armLen = beltW + 0.7;

function buildGate(stopX, mountOnPositiveZ, color){
  var mountZ = mountOnPositiveZ ? (beltW/2 + 0.45) : -(beltW/2 + 0.45);
  var mountGroup = new THREE.Group();
  mountGroup.position.set(stopX, BELT_TOP_Y + 0.32, mountZ);
  scene.add(mountGroup);

  // เสาค้ำยึดกับพื้น (ของเดิมลอยอยู่ ไม่มีตัวเชื่อมกับโครง/พื้น)
  var supportLen = mountGroup.position.y - GROUND_Y;
  var support = new THREE.Mesh(new THREE.BoxGeometry(0.14, supportLen, 0.14), frameMat);
  support.position.y = -supportLen/2;
  mountGroup.add(support);
  var supportFoot = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.05,0.38), frameMat);
  supportFoot.position.y = -supportLen - 0.025;
  mountGroup.add(supportFoot);

  var cylMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.45,16), pneuMat);
  cylMesh.rotation.x = Math.PI/2;
  cylMesh.position.z = mountOnPositiveZ ? 0.18 : -0.18;
  mountGroup.add(cylMesh);

  var bracket = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.28,0.14), clampMat);
  bracket.position.set(0,-0.2, mountOnPositiveZ ? 0.28 : -0.28);
  mountGroup.add(bracket);

  var armGroup = new THREE.Group();
  armGroup.rotation.x = mountOnPositiveZ ? -Math.PI/2 : Math.PI/2;
  mountGroup.add(armGroup);

  var armRod = new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.065,armLen,14), color);
  armRod.position.y = armLen/2;
  armGroup.add(armRod);

  var armPaddle = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.46,0.14), color);
  armPaddle.position.y = armLen;
  armGroup.add(armPaddle);

  armGroup.scale.y = 0.02;
  return armGroup;
}

var gate1LeadEdgeX = STOP1_X + plateLen/2;
var gate2LeadEdgeX = STOP2_X + plateLen/2;
var gate1Arm = buildGate(gate1LeadEdgeX + 0.22, true, stopperMat1);
var gate2Arm = buildGate(gate2LeadEdgeX + 0.22, false, stopperMat2);

// ================= VISION CAMERA (ตรวจสอบว่าติดโบ้วโอเคไหม) =================
var camPostH = (BELT_TOP_Y + 2.1) - GROUND_Y; // ยืดเสาให้ถึงพื้นจริง
var visionGroup = new THREE.Group();
var visionPost = new THREE.Mesh(new THREE.BoxGeometry(0.14, camPostH, 0.14), frameMat);
visionPost.position.set(0, camPostH/2, 0);
visionGroup.add(visionPost);
var visionFoot = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.04,0.36), frameMat);
visionFoot.position.set(0, -0.02, 0);
visionGroup.add(visionFoot);
var visionArm = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.12,0.12), frameMat);
visionArm.position.set(-0.42, camPostH, 0);
visionGroup.add(visionArm);
var visionClamp = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.16,0.18), clampMat);
visionClamp.position.set(-0.8, camPostH + 0.02, 0);
visionGroup.add(visionClamp);
var visionBody = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.5,0.4), visionMat);
visionBody.position.set(-0.8, camPostH - 0.05, 0);
visionGroup.add(visionBody);
var visionLens = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.13,0.22,16), darkMetal);
visionLens.rotation.x = Math.PI/2.2;
visionLens.position.set(-0.8, camPostH - 0.38, 0.08);
visionGroup.add(visionLens);
var visionLED = new THREE.Mesh(new THREE.SphereGeometry(0.06,12,12), new THREE.MeshBasicMaterial({color:0x333333}));
visionLED.position.set(-0.8, camPostH + 0.24, 0);
visionGroup.add(visionLED);
visionGroup.position.set(CAM_X, GROUND_Y, -beltW/2 - 0.35);
scene.add(visionGroup);

// ================= REJECT PUSHER (ดันชิ้นงานที่ NG ออกอีกฝั่ง) =================
// ติดตั้งฝั่งตรงข้ามกับทิศทางที่จะดันออก แล้วยื่นแขนดันชิ้นงานข้ามสายพานไปอีกฝั่ง
var pushMountGroup = new THREE.Group();
pushMountGroup.position.set(PUSH_X, BELT_TOP_Y + 0.35, -beltW/2 - 0.5);
scene.add(pushMountGroup);

var pushSupportLen = pushMountGroup.position.y - GROUND_Y;
var pushSupport = new THREE.Mesh(new THREE.BoxGeometry(0.14, pushSupportLen, 0.14), frameMat);
pushSupport.position.y = -pushSupportLen/2;
pushMountGroup.add(pushSupport);
var pushSupportFoot = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.05,0.38), frameMat);
pushSupportFoot.position.y = -pushSupportLen - 0.025;
pushMountGroup.add(pushSupportFoot);

var pushCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.55,16), rejectMat);
pushCyl.rotation.x = Math.PI/2;
pushCyl.position.z = 0.2;
pushMountGroup.add(pushCyl);
var pushBracket = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.16), clampMat);
pushBracket.position.set(0,-0.22,0.3);
pushMountGroup.add(pushBracket);

var pushArmGroup = new THREE.Group();
pushArmGroup.rotation.x = Math.PI/2; // ยื่นเข้าหาสายพาน ข้ามไปอีกฝั่ง (ฝั่ง +Z ที่ถาดของเสียอยู่)
pushMountGroup.add(pushArmGroup);

var pushArmLen = beltW + offBeltZ + 1.2;
var pushRod = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,pushArmLen,14), rejectMat);
pushRod.position.y = pushArmLen/2;
pushArmGroup.add(pushRod);
var pushPaddle = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.16), rejectMat);
pushPaddle.position.y = pushArmLen;
pushArmGroup.add(pushPaddle);
pushArmGroup.scale.y = 0.02;

// reject bin/chute on the far side (+Z) where NG parts end up
var binGroup = new THREE.Group();
var binFloor = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.15, 1.6), binMat);
binFloor.position.set(PUSH_X + 1.0, BELT_TOP_Y - 0.55, offBeltZ + 0.3);
binFloor.rotation.z = -0.12;
binGroup.add(binFloor);
var binWall = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.5, 0.12), binMat);
binWall.position.set(PUSH_X + 1.0, BELT_TOP_Y - 0.2, offBeltZ + 1.05);
binGroup.add(binWall);
scene.add(binGroup);

// ================= STATE / ANIMATION =================
var playing = false, t = 0, speed = 1;
var spinAngleA = 0, spinAngleB = 0;
var inspectionResult = 'OK';

var playBtn = document.getElementById('playBtn');
var stateEl = document.getElementById('state');
var okBtn = document.getElementById('okBtn');
var ngBtn = document.getElementById('ngBtn');

document.getElementById('speed').addEventListener('input', function(e){ speed = parseFloat(e.target.value); });
playBtn.addEventListener('click', function(){
  playing = !playing;
  playBtn.textContent = playing ? 'หยุดชั่วคราว' : 'เริ่มรอบการทำงาน';
});
document.getElementById('resetBtn').addEventListener('click', function(){
  playing = false; t = 0; spinAngleA = 0; spinAngleB = 0;
  playBtn.textContent = 'เริ่มรอบการทำงาน';
  stateEl.textContent = 'พร้อมทำงาน';
});
okBtn.addEventListener('click', function(){ inspectionResult='OK'; okBtn.className='active-ok'; ngBtn.className=''; });
ngBtn.addEventListener('click', function(){ inspectionResult='NG'; ngBtn.className='active-ng'; okBtn.className=''; });

function clamp01(v){ return Math.max(0, Math.min(1, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }

var P = {
  travel1End: 0.09,
  stop1DetectEnd: 0.115,
  tighten1DescendEnd: 0.14,
  tighten1SpinEnd: 0.255,
  tighten1RetractEnd: 0.28,
  gate1RetractEnd: 0.30,
  travel2End: 0.38,
  stop2DetectEnd: 0.405,
  tighten2DescendEnd: 0.43,
  tighten2SpinEnd: 0.545,
  tighten2RetractEnd: 0.57,
  gate2RetractEnd: 0.59,
  travel3End: 0.68,
  camScanEnd: 0.73,
  travel4End: 0.82,
  pushEnd: 0.88
};

function cycleState(phase){
  if(phase < P.travel1End) return 'ชิ้นงานไหลเข้ามา — นอตตัวหน้ากำลังเข้าหาสถานี';
  if(phase < P.stop1DetectEnd) return 'เซนเซอร์ตรวจพบ → นิวเมติกตัวที่ 1 กางออกกันนอตตัวหน้า';
  if(phase < P.tighten1DescendEnd) return 'เซอร์โวเลื่อนลงมาสวมนอตตัวหน้า';
  if(phase < P.tighten1SpinEnd) return 'เซอร์โวหมุนขันนอตตัวหน้าลงตามเกลียว';
  if(phase < P.tighten1RetractEnd) return 'เซอร์โวถอยกลับขึ้น';
  if(phase < P.gate1RetractEnd) return 'นิวเมติกตัวที่ 1 หดกลับ ปล่อยชิ้นงาน';
  if(phase < P.travel2End) return 'ชิ้นงานไหลต่อ — นอตตัวหลังกำลังเข้าหาสถานี';
  if(phase < P.stop2DetectEnd) return 'เซนเซอร์ตรวจพบ → นิวเมติกตัวที่ 2 กางออกกันนอตตัวหลัง';
  if(phase < P.tighten2DescendEnd) return 'เซอร์โวเลื่อนลงมาสวมนอตตัวหลัง';
  if(phase < P.tighten2SpinEnd) return 'เซอร์โวหมุนขันนอตตัวหลังลงตามเกลียว';
  if(phase < P.tighten2RetractEnd) return 'เซอร์โวถอยกลับขึ้น';
  if(phase < P.gate2RetractEnd) return 'นิวเมติกตัวที่ 2 หดกลับ ปล่อยชิ้นงาน';
  if(phase < P.travel3End) return 'ชิ้นงานไหลเข้าหากล้องตรวจสอบ';
  if(phase < P.camScanEnd) return inspectionResult==='OK' ? 'กล้องตรวจสอบ: ติดโบ้วโอเค (OK)' : 'กล้องตรวจสอบ: ติดโบ้วไม่ผ่าน (NG)';
  if(phase < P.travel4End) return inspectionResult==='OK' ? 'ชิ้นงานไหลผ่านต่อไปยังปลายทาง' : 'ชิ้นงานไหลเข้าหานิวเมติกคัดของเสีย';
  if(phase < P.pushEnd) return inspectionResult==='OK' ? 'ชิ้นงานไหลผ่านไปตามปกติ' : 'นิวเมติกดันชิ้นงาน NG ออกอีกฝั่ง';
  return inspectionResult==='OK' ? 'ชิ้นงานผ่านการตรวจสอบ ไหลออกปลายทาง' : 'ชิ้นงาน NG ถูกคัดออกแล้ว';
}

var cycleLen = 13;
function animate(){
  requestAnimationFrame(animate);
  if(playing){ t += 0.016 * speed; }
  var phase = (t % cycleLen) / cycleLen;
  stateEl.textContent = playing ? cycleState(phase) : 'พร้อมทำงาน';

  // --- product X travel ---
  var px;
  if(phase < P.travel1End){
    px = lerp(ENTRY_X, STOP1_X, clamp01(phase/P.travel1End));
  } else if(phase < P.gate1RetractEnd){
    px = STOP1_X;
  } else if(phase < P.travel2End){
    px = lerp(STOP1_X, STOP2_X, clamp01((phase-P.gate1RetractEnd)/(P.travel2End-P.gate1RetractEnd)));
  } else if(phase < P.gate2RetractEnd){
    px = STOP2_X;
  } else if(phase < P.travel3End){
    px = lerp(STOP2_X, CAM_X, clamp01((phase-P.gate2RetractEnd)/(P.travel3End-P.gate2RetractEnd)));
  } else if(phase < P.camScanEnd){
    px = CAM_X;
  } else if(phase < P.travel4End){
    px = lerp(CAM_X, PUSH_X, clamp01((phase-P.camScanEnd)/(P.travel4End-P.camScanEnd)));
  } else if(phase < P.pushEnd){
    px = PUSH_X;
  } else {
    px = lerp(PUSH_X, EXIT_X, clamp01((phase-P.pushEnd)/(1-P.pushEnd)));
  }
  productGroup.position.x = px;

  // --- product Z travel (only diverges if NG, during/after the push window) ---
  var pz = 0;
  if(inspectionResult === 'NG'){
    if(phase >= P.travel4End && phase < P.pushEnd){
      pz = lerp(0, offBeltZ, clamp01((phase-P.travel4End)/(P.pushEnd-P.travel4End)));
    } else if(phase >= P.pushEnd){
      pz = offBeltZ;
    }
  }
  productGroup.position.z = pz;

  // --- sensor #1 LED + live beam ---
  var sensing = (phase > 0.06 && phase < P.gate1RetractEnd) || (phase > (P.travel2End-0.06) && phase < P.gate2RetractEnd);
  sensorLED.material.color.set(sensing ? 0x4fe0a0 : 0x333333);
  beam.material.opacity = sensing ? 0.65 : 0.15;
  updateBeam();

  // --- vision camera LED (shows result while scanning) ---
  var scanning = (phase > (P.travel3End-0.03) && phase < P.travel4End);
  if(scanning){
    visionLED.material.color.set(inspectionResult==='OK' ? 0x4fe0a0 : 0xe0524a);
  } else {
    visionLED.material.color.set(0x333333);
  }

  // --- andon signal tower: เหลืองตอนขัน / เขียวตอนวิ่งปกติ / แดงกะพริบตอนคัดของเสีย ---
  var tighteningNow = (phase >= P.stop1DetectEnd && phase < P.tighten1RetractEnd) || (phase >= P.stop2DetectEnd && phase < P.tighten2RetractEnd);
  var rejectingNow = (inspectionResult === 'NG') && (phase >= P.travel4End && phase < P.pushEnd + 0.06);
  towerYellow.material.emissiveIntensity = (playing && tighteningNow) ? 0.9 : 0.12;
  towerGreen.material.emissiveIntensity = (playing && !tighteningNow && !rejectingNow) ? 0.9 : 0.12;
  towerRed.material.emissiveIntensity = (playing && rejectingNow) ? (0.4 + 0.6*Math.abs(Math.sin(t*10))) : 0.12;

  // --- gate 1 ---
  var g1 = 0;
  if(phase > P.travel1End && phase < P.stop1DetectEnd){ g1 = clamp01((phase-P.travel1End)/(P.stop1DetectEnd-P.travel1End)); }
  else if(phase >= P.stop1DetectEnd && phase < P.tighten1RetractEnd){ g1 = 1; }
  else if(phase >= P.tighten1RetractEnd && phase < P.gate1RetractEnd){ g1 = 1 - clamp01((phase-P.tighten1RetractEnd)/(P.gate1RetractEnd-P.tighten1RetractEnd)); }
  gate1Arm.scale.y = Math.max(0.02, g1);

  // --- gate 2 ---
  var g2 = 0;
  if(phase > P.travel2End && phase < P.stop2DetectEnd){ g2 = clamp01((phase-P.travel2End)/(P.stop2DetectEnd-P.travel2End)); }
  else if(phase >= P.stop2DetectEnd && phase < P.tighten2RetractEnd){ g2 = 1; }
  else if(phase >= P.tighten2RetractEnd && phase < P.gate2RetractEnd){ g2 = 1 - clamp01((phase-P.tighten2RetractEnd)/(P.gate2RetractEnd-P.tighten2RetractEnd)); }
  gate2Arm.scale.y = Math.max(0.02, g2);

  // --- reject pusher (only extends for NG parts) ---
  var gp = 0;
  if(inspectionResult === 'NG'){
    if(phase >= P.travel4End && phase < P.pushEnd){ gp = clamp01((phase-P.travel4End)/(P.pushEnd-P.travel4End)); }
    else if(phase >= P.pushEnd && phase < P.pushEnd + 0.03){ gp = 1; }
    else if(phase >= P.pushEnd + 0.03 && phase < P.pushEnd + 0.06){ gp = 1 - clamp01((phase-(P.pushEnd+0.03))/0.03); }
  }
  pushArmGroup.scale.y = Math.max(0.02, gp);

  // --- single tightener: descend/engage/spin/retract for nut A, then again for nut B ---
  var engageDrop = 0.68;
  var nutTravel = (nutTopY - nutSeatedY);
  var rodDepth = 0;

  if(phase > P.stop1DetectEnd && phase < P.tighten1DescendEnd){
    rodDepth = lerp(0, engageDrop, clamp01((phase-P.stop1DetectEnd)/(P.tighten1DescendEnd-P.stop1DetectEnd)));
  } else if(phase >= P.tighten1DescendEnd && phase < P.tighten1SpinEnd){
    rodDepth = lerp(engageDrop, engageDrop+nutTravel, clamp01((phase-P.tighten1DescendEnd)/(P.tighten1SpinEnd-P.tighten1DescendEnd)));
  } else if(phase >= P.tighten1SpinEnd && phase < P.tighten1RetractEnd){
    rodDepth = lerp(engageDrop+nutTravel, 0, clamp01((phase-P.tighten1SpinEnd)/(P.tighten1RetractEnd-P.tighten1SpinEnd)));
  } else if(phase > P.stop2DetectEnd && phase < P.tighten2DescendEnd){
    rodDepth = lerp(0, engageDrop, clamp01((phase-P.stop2DetectEnd)/(P.tighten2DescendEnd-P.stop2DetectEnd)));
  } else if(phase >= P.tighten2DescendEnd && phase < P.tighten2SpinEnd){
    rodDepth = lerp(engageDrop, engageDrop+nutTravel, clamp01((phase-P.tighten2DescendEnd)/(P.tighten2SpinEnd-P.tighten2DescendEnd)));
  } else if(phase >= P.tighten2SpinEnd && phase < P.tighten2RetractEnd){
    rodDepth = lerp(engageDrop+nutTravel, 0, clamp01((phase-P.tighten2SpinEnd)/(P.tighten2RetractEnd-P.tighten2SpinEnd)));
  }
  rodGroup.position.y = -rodDepth;

  var spinningA = (phase >= P.tighten1DescendEnd && phase < P.tighten1SpinEnd);
  var spinningB = (phase >= P.tighten2DescendEnd && phase < P.tighten2SpinEnd);
  if(spinningA && playing){ spinAngleA += 0.28 * speed; }
  if(spinningB && playing){ spinAngleB += 0.28 * speed; }
  rodGroup.rotation.y = spinningA ? spinAngleA : (spinningB ? spinAngleB : rodGroup.rotation.y);

  var nutYA = nutTopY;
  if(spinningA){ nutYA = lerp(nutTopY, nutSeatedY, clamp01((phase-P.tighten1DescendEnd)/(P.tighten1SpinEnd-P.tighten1DescendEnd))); }
  else if(phase >= P.tighten1SpinEnd){ nutYA = nutSeatedY; }
  studA.userData.nutGroup.position.y = nutYA;
  studA.userData.nutGroup.rotation.y = spinAngleA;

  var nutYB = nutTopY;
  var nutSeatedYB = (inspectionResult === 'NG') ? lerp(nutSeatedY, nutTopY, 0.45) : nutSeatedY;
  if(spinningB){ nutYB = lerp(nutTopY, nutSeatedYB, clamp01((phase-P.tighten2DescendEnd)/(P.tighten2SpinEnd-P.tighten2DescendEnd))); }
  else if(phase >= P.tighten2SpinEnd){ nutYB = nutSeatedYB; }
  studB.userData.nutGroup.position.y = nutYB;
  studB.userData.nutGroup.rotation.y = spinAngleB;
  studB.userData.nutGroup.rotation.z = (inspectionResult === 'NG' && phase >= P.tighten2SpinEnd) ? 0.22 : 0;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
